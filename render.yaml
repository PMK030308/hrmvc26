# Render Blueprint — Backend HRM Chấm công (Express + better-sqlite3 + JWT)
# Docs: https://render.com/docs/blueprint-spec
#
# Cách dùng:
#   1. Đăng nhập https://dashboard.render.com
#   2. New (góc phải) → Blueprint → chọn repo GitHub "PMK030308/hrmvc26"
#   3. Render tự đọc file này và tạo service "hrm-attendance-api".
# Production blueprint fail-closed: paid persistent disk, one instance, no automatic deploy.
# Backup flags stay manual until backup/restore has actually been verified.
services:
  - type: web
    name: hrm-attendance-api
    runtime: node
    rootDir: server
    plan: starter
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    disk:
      name: hrm-production-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: HRM_DB_PATH
        value: /opt/render/project/src/data/hrm.db
      - key: DATABASE_PERSISTENT_VOLUME
        value: "true"
      - key: DATABASE_BACKUP_CONFIRMED
        sync: false
      - key: ATTACHMENT_STORAGE_PROVIDER
        value: local
      - key: ATTACHMENT_STORAGE_ROOT
        value: /opt/render/project/src/data
      - key: ATTACHMENT_STORAGE_PERSISTENT_VOLUME
        value: "true"
      - key: ATTACHMENT_STORAGE_BACKUP_CONFIRMED
        sync: false
      - key: PASSWORD_RESET_DELIVERY_PROVIDER
        value: webhook
      - key: PASSWORD_RESET_WEBHOOK_URL
        sync: false
      - key: PASSWORD_RESET_WEBHOOK_BEARER_TOKEN
        generateValue: true
      - key: PASSWORD_RESET_PUBLIC_URL
        sync: false
      - key: RETENTION_SCHEDULER_ENABLED
        value: "true"
      - key: RETENTION_SCHEDULER_INITIAL_DELAY_MS
        value: "300000"
      - key: RETENTION_SCHEDULER_INTERVAL_MS
        value: "86400000"
      - key: RETENTION_SCHEDULER_BATCH_SIZE
        value: "100"
